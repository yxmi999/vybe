<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Vybe tabs</title>
<!-- The desktop window's top bar: back / forward / reload, the tab strip, +.
     State comes from tabs.cjs over window.vybeTabs (toolbar-preload.cjs). -->
<style>
  @font-face { font-family: "Space Grotesk"; font-weight: 500; src: url("assets/fonts/SpaceGrotesk-Medium.ttf") format("truetype"); }
  :root { --bg: #0d0d10; --tab: #16161b; --tab-hover: #1b1b21; --line: rgba(255,255,255,0.07); --cobalt: #4a76d4; --cyan: #22d3ee; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body {
    display: flex; align-items: center; gap: 6px; padding: 0 8px;
    font: 500 12.5px "Space Grotesk", ui-sans-serif, system-ui, sans-serif; color: rgba(255,255,255,0.55);
    border-bottom: 1px solid var(--line); -webkit-user-select: none; user-select: none;
  }

  .nav { display: flex; gap: 2px; flex-shrink: 0; }
  button {
    all: unset; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px;
    color: rgba(255,255,255,0.6); cursor: pointer; transition: background-color 120ms, color 120ms;
  }
  button:hover:not(:disabled) { background: rgba(255,255,255,0.07); color: #fff; }
  button:active:not(:disabled) { background: rgba(255,255,255,0.11); }
  button:disabled { color: rgba(255,255,255,0.2); cursor: default; }
  button:focus-visible { outline: 2px solid var(--cobalt); outline-offset: -2px; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .divider { width: 1px; height: 18px; background: var(--line); margin: 0 4px; flex-shrink: 0; }

  .strip { display: flex; align-items: flex-end; gap: 4px; min-width: 0; flex: 1; overflow: hidden; height: 100%; padding-top: 6px; }
  .tab {
    position: relative; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 6px 0 11px;
    min-width: 72px; max-width: 210px; flex: 1 1 210px; border-radius: 9px 9px 0 0;
    color: rgba(255,255,255,0.5); cursor: default; transition: background-color 120ms, color 120ms;
  }
  .tab:hover { background: var(--tab-hover); color: rgba(255,255,255,0.8); }
  /* Active tab takes the page colour and sits over the bar's bottom border,
     so it reads as attached to the page below (like a browser tab). */
  .tab.active { background: #0a0a0a; color: #fff; box-shadow: 0 1px 0 #0a0a0a, inset 1px 0 0 var(--line), inset -1px 0 0 var(--line); }
  .tab.active::before {
    content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 2px; border-radius: 0 0 2px 2px;
    background: linear-gradient(90deg, var(--cobalt), var(--cyan));
  }
  .tab.dragging { opacity: 0.5; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: linear-gradient(135deg, var(--cobalt), var(--cyan)); }
  .tab:not(.app) .dot { background: rgba(255,255,255,0.3); }
  .spin { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid rgba(255,255,255,0.15); border-top-color: var(--cyan); animation: spin 700ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .close { width: 20px; height: 20px; border-radius: 5px; opacity: 0; flex-shrink: 0; }
  .close svg { width: 12px; height: 12px; }
  .tab:hover .close, .tab.active .close { opacity: 1; }
  .add { flex-shrink: 0; margin-top: 6px; }
</style>
</head>
<body>
  <div class="nav">
    <button id="back" title="Back (Alt+←)" aria-label="Back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <button id="forward" title="Forward (Alt+→)" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
    <button id="reload" title="Reload (Ctrl+R)" aria-label="Reload"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    <button id="home" title="Dashboard" aria-label="Dashboard"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></button>
  </div>
  <div class="divider"></div>
  <div class="strip" id="strip" role="tablist" aria-label="Open pages"></div>
  <button class="add" id="add" title="New tab (Ctrl+T)" aria-label="New tab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<script>
(() => {
  const api = window.vybeTabs;
  const $ = (id) => document.getElementById(id);
  const strip = $("strip");
  const send = (cmd) => api.command(cmd);

  $("back").onclick = () => send({ type: "back" });
  $("forward").onclick = () => send({ type: "forward" });
  $("reload").onclick = () => send({ type: "reload" });
  $("home").onclick = () => send({ type: "home" });
  $("add").onclick = () => send({ type: "new" });
  // Double-click empty strip space → new tab, like a browser.
  strip.addEventListener("dblclick", (e) => { if (e.target === strip) send({ type: "new" }); });

  let dragId = null;
  let order = [];                 // tab ids in strip order (for drop index)
  const els = new Map();          // tab id → element, KEPT between updates

  // One element per tab, created once. State updates (loading spinners,
  // titles, the active tab) only patch it — rebuilding the strip would
  // destroy the button under the cursor mid-click, so clicks on × got lost.
  function make(id) {
    const el = document.createElement("div");
    el.className = "tab";
    el.setAttribute("role", "tab");
    el.draggable = true;
    el.innerHTML = '<span class="dot"></span><span class="title"></span>' +
      '<button class="close" title="Close (Ctrl+W)"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>';
    const close = el.querySelector(".close");
    // The × must not also count as "switch to this tab".
    close.onmousedown = (e) => e.stopPropagation();
    close.onclick = (e) => { e.stopPropagation(); send({ type: "close", id }); };
    el.onmousedown = (e) => { if (e.button === 0) send({ type: "activate", id }); };
    el.onauxclick = (e) => { if (e.button === 1) { e.preventDefault(); send({ type: "close", id }); } };   // middle-click closes
    el.oncontextmenu = (e) => { e.preventDefault(); send({ type: "menu", id }); };
    // Drag to reorder.
    el.ondragstart = () => { dragId = id; el.classList.add("dragging"); };
    el.ondragend = () => { dragId = null; el.classList.remove("dragging"); };
    el.ondragover = (e) => e.preventDefault();
    el.ondrop = (e) => { e.preventDefault(); if (dragId != null && dragId !== id) send({ type: "move", id: dragId, index: order.indexOf(id) }); };
    return el;
  }

  api.onState((s) => {
    $("back").disabled = !s.canBack;
    $("forward").disabled = !s.canForward;
    order = s.tabs.map((t) => t.id);
    const live = new Set(order);
    for (const [id, el] of els) if (!live.has(id)) { el.remove(); els.delete(id); }
    s.tabs.forEach((t, index) => {
      let el = els.get(t.id);
      if (!el) { el = make(t.id); els.set(t.id, el); }
      const active = t.id === s.activeId;
      el.classList.toggle("active", active);
      el.classList.toggle("app", t.app);
      el.setAttribute("aria-selected", String(active));
      el.title = t.title;
      el.querySelector(".title").textContent = t.title;
      el.querySelector(".close").setAttribute("aria-label", `Close ${t.title}`);
      const icon = el.firstElementChild;
      const cls = t.loading ? "spin" : "dot";
      if (icon.className !== cls) icon.className = cls;
      // Keep DOM order in sync without recreating anything.
      if (strip.children[index] !== el) strip.insertBefore(el, strip.children[index] ?? null);
    });
  });
})();
</script>
</body>
</html>
